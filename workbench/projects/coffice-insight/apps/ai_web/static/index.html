<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 数据分析 · 经营配置中心</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/identity-assets/shell.css"><link rel="stylesheet" href="/ai-assets/ai.css"><link rel="stylesheet" href="/ai-assets/layout.css"></head><body>
<div class="app-shell"><aside class="sidebar"><div class="brand"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><strong>经营配置中心</strong></div><div class="sidebar-menu nav-loading"></div></aside>
<div class="content-shell"><header class="topbar"><div class="page-heading"><h1>AI 数据分析</h1><p>安全、只读、可追溯的经营数据分析</p></div></header>
<main class="ai-layout"><aside class="conversation-pane"><div class="conversation-head"><div><strong>会话记录</strong><small>上下文按会话独立保存</small></div><button class="button primary conversation-create" id="newConversation" type="button">＋ 新建对话</button></div><div id="conversationList" class="conversation-list"><div class="empty-mini">加载中…</div></div></aside>
<section class="chat-pane"><div class="chat-head"><div><strong id="activeConversationTitle">新对话</strong><small><span class="security-dot"></span>专用只读数据源 · SQL 安全校验</small></div><span id="generationState" class="generation-state">就绪</span></div><div id="chatScroller" class="chat-scroller"><div id="emptyState" class="chat-empty"><div class="empty-icon">AI</div><h2>今天想分析什么？</h2><p>可直接提问，或选择一个提示词模板改变分析方式。</p><div class="suggestion-grid"><button type="button" data-suggestion="请概览最新完整数据日期和当前经营情况">经营概览</button><button type="button" data-suggestion="请生成一份每日经营分析报告">每日分析报告</button><button type="button" data-suggestion="请检查当前数据的完整性、时效性和异常值">数据质量检查</button></div><div class="guard-note">回答会注明数据来源、时间范围、筛选条件和计算口径。</div></div><div id="messages" class="messages"></div><button id="jumpLatest" class="jump-latest" hidden>回到最新消息 ↓</button></div>
<div class="composer"><div id="commandPanel" class="command-panel" hidden></div><div class="composer-box"><textarea id="messageInput" rows="1" maxlength="8000" placeholder="向 AI 提问；输入 / 选择提示词模板"></textarea><div class="composer-tools"><button id="openCommands" type="button" title="选择提示词模板">/ 提示词</button><button id="selectedPrompt" type="button" class="selected-prompt" hidden></button><span id="composerHint">Enter 发送 · Shift+Enter 换行</span><button id="stopGeneration" class="button danger" hidden>停止</button><button id="sendMessage" class="button primary">发送</button></div></div></div></section></main></div></div>
<div id="aiToast" class="ai-toast" hidden></div><script src="/identity-assets/shell.js" defer></script><script src="/ai-assets/messages.js" defer></script><script src="/ai-assets/conversations.js" defer></script><script src="/ai-assets/app.js" defer></script></body></html>
