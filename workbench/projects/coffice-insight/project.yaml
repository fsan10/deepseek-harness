# 联邦单元：从 coffice-core（原一体式平台）按业务域拆出，代码为物理副本。
id: coffice-insight
name: 分析与看板
form: service
domain: 数据
owner: 数据组
description: 从 mock_coffice 拆出的分析与看板单元，保留原模块源码，外层为零依赖自检服务。
source: coffice-core（本仓库内物理副本，非引用）
port: 8792
health:
  path: /health
  timeoutMs: 1200
runtime:
  command: python
  args: [service/app.py, --port, 8792]
  start: runtime/start.ps1
  cwd: .
depends: [coffice-core]
capabilities: [AI 管理, 自然语言分析, AI 前端资源, 飞书助手, 看板代理]
levels:
  read: L0
  write: L2
