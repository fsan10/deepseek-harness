<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 经营配置中心</title><link rel="stylesheet" href="/identity-assets/login.css"></head><body>
  <main class="login-shell"><section class="login-brand"><div class="brand-mark">经</div><h1>经营配置中心</h1><p>银行资金、达播运营、数据导入与经营看板统一配置台</p></section>
  <section class="login-card"><header><span>安全登录</span><h2>欢迎回来</h2><p>请输入管理员分配的账号和密码</p></header><form id="loginForm"><label>用户名<input id="username" name="username" autocomplete="username" maxlength="64" required autofocus></label><label>密码<input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required></label><p id="loginError" class="error" role="alert" hidden></p><p id="loginStatus" class="status" role="status" hidden></p><button id="loginButton" type="submit">登录</button></form><footer>登录请求受到前后端双重频率限制；密码连续错误会临时锁定账号</footer></section></main>
  <script src="/identity-assets/login.js"></script></body></html>
