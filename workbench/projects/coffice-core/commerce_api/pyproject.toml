[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-api-cli"
version = "0.1.0"
description = "One CLI with independent ecommerce portal API adapters"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27,<1",
  "playwright>=1.49,<2",
  "requests>=2.32,<3",
  "websocket-client>=1.8,<2",
  "cryptography>=44",
  "psycopg2-binary>=2.9,<3",
  "openpyxl>=3.1,<4",
  "msoffcrypto-tool>=5.4,<6",
  "xlrd>=2,<3",
  "olefile>=0.47,<1",
  "tzdata>=2024.1"
]

[project.scripts]
commerce = "commerce_api.cli.main:entrypoint"
